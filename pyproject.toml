[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "knowgraph-ai"
version = "0.1.0"
description = "Evidence-grounded local engineering investigator"
requires-python = ">=3.12"
dependencies = ["falkordb>=1.0.0", "fastapi>=0.115", "pydantic>=2.7", "pydantic-settings>=2.2", "streamlit>=1.36", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["knowgraph*", "frontend*"]
