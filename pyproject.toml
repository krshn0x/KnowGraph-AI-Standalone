[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "knowgraph-ai"
version = "0.1.0"
description = "An evidence-backed engineering company brain powered by FalkorDB"
requires-python = ">=3.13"
dependencies = [
  "fastapi==0.143.2", "uvicorn==0.54.0", "pydantic==2.14.1",
  "pydantic-settings==2.16.0", "falkordb==1.8.0", "openai==2.54.0",
  "httpx==0.28.1",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[project.scripts]
knowgraph = "knowgraph.cli:main"

[tool.setuptools.packages.find]
include = ["knowgraph*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a running FalkorDB instance", "live: requires an OpenAI key and incurs API usage"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
